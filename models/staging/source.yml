version: 2
sources:
    - name: snowflake_data
      database: "{{('DI_SALES_DEV')}}"
      schema: raw_schema
      tables:
        - name: RAW_LINEITEM
          columns:
            - name: l_orderkey
              tests:
                - not_null
            - name: l_quantity
              tests:
                - not_null
            - name: l_linenumber
              tests:
                - not_null  
        - name: RAW_NATION
          columns:
            - name: n_nationkey
              tests:
                - unique
                - not_null
            - name: n_name
              tests:
                - not_null
        - name: RAW_ORDER
          columns:
            - name: o_orderkey
              tests:
               - unique
               - not_null

        - name: RAW_CUSTOMER 
          columns:
           - name: c_custkey
             tests:
              - unique
              - not_null
           - name: c_name
             tests:
               - not_null
      


    - name: snapshot_tables
      database: "{{('DI_SALES_DEV')}}"
      schema: SNAPSHOT_TABLES
      tables:
        - name: snap_ordersdetails